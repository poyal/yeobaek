<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>여백 — 심볼과 이름 조합</title>
  <script src="catalog.js" defer></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f8f5ef;color:#30372f;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased}header{padding:44px 54px 33px;border-bottom:1px solid #d4d7c8;display:flex;justify-content:space-between;gap:32px;align-items:flex-end}.eyebrow{color:#5f6958;font-size:10px;letter-spacing:2px}h1,h2,.wordmark{font-family:"AppleMyungjo",Georgia,serif;font-weight:500}h1{font-size:34px;letter-spacing:-1px;margin:15px 0 0}header p{font-size:12px;line-height:1.8;color:#5f6958;margin:0}main{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:35px 38px 46px}.candidate{min-width:0;padding:0 25px;border-right:1px solid #d4d7c8}.candidate:last-child{border-right:0}.mark{width:216px;height:216px;margin:18px auto 24px}svg{width:100%;height:100%;display:block}.icon-art{fill:currentColor;color:inherit}.candidate h2{font-size:27px;margin:0 0 15px}.candidate h2 small{font-family:Georgia,serif;font-size:12px;color:#7b8573;margin-right:12px}.construction{font-size:11px;color:#5f6958;line-height:2;min-height:70px;word-break:keep-all}.lockup{border-top:1px solid #d4d7c8;margin-top:27px;padding-top:25px;display:flex;align-items:center;gap:13px}.lockup-icon{width:50px;height:50px;flex-shrink:0}.wordmark{font-size:29px;letter-spacing:3px}.lockup p{font-size:9px;color:#7b8573;margin:7px 0 0;letter-spacing:.3px}footer{padding:25px 54px;border-top:1px solid #d4d7c8;display:flex;justify-content:space-between;gap:20px;color:#5f6958;font-size:11px}a{color:inherit;text-underline-offset:4px}:focus-visible{outline:2px solid #536348;outline-offset:5px}@media(max-width:1250px){main{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:45px}.candidate:nth-child(3n){border-right:0}.mark{width:185px;height:185px}}@media(max-width:750px){header{display:block;padding:28px}header p{margin-top:20px}h1{font-size:27px}main{grid-template-columns:repeat(2,minmax(0,1fr));padding:25px 15px;row-gap:40px}.candidate{padding:0 20px}.candidate:nth-child(3n){border-right:1px solid #d4d7c8}.candidate:nth-child(2n),.candidate:last-child{border-right:0}.mark{width:160px;height:160px}.candidate h2{font-size:23px}.wordmark{font-size:24px}.lockup{gap:7px}footer{padding:24px;flex-wrap:wrap}}@media(max-width:480px){main{grid-template-columns:1fr}.candidate,.candidate:nth-child(3n){border-right:0}.mark{width:220px;height:220px}.construction{min-height:0}.lockup{margin-top:18px;padding-top:17px}.candidate{padding-bottom:15px}.candidate h2{font-size:27px}}
  </style>
</head>
<body>
  <header><div><span class="eyebrow">YEOBAEK / ORIGINAL SYMBOLS / STUDY 03</span><h1>비어 있는 자리가, 여백의 얼굴이 되도록.</h1></div><p>심볼의 실루엣과 이름 조합<br>다섯 가지 형태를 같은 조건에서 비교합니다.</p></header>
  <main id="symbols"></main>
  <footer><span>여백 · 읽는 시간, 나만의 자리.</span><a href="index.html">아이콘 색상·앱 조합 보기 ↗</a><a href="README.md">형태 설계 노트 ↗</a></footer>
  <script>
    document.addEventListener('DOMContentLoaded',()=>{
      document.querySelector('#symbols').innerHTML=window.YeobaekIcons.map(item=>`<article class="candidate"><div class="mark">${window.yeobaekIconSvg(item.id,'light','monochrome')}</div><h2><small>${item.number}</small>${item.name}</h2><p class="construction">${item.construction.split(' / ').join('<br>')}</p><div class="lockup"><span class="lockup-icon">${window.yeobaekIconSvg(item.id,'light','monochrome')}</span><div><span class="wordmark">여백</span><p>읽는 시간, 나만의 자리.</p></div></div></article>`).join('');
    });
  </script>
</body>
</html>
