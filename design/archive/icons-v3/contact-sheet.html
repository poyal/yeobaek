<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>여백 — 세 번째 브랜드 아이콘 5종 비교</title><script src="catalog.js" defer></script><style>
*{box-sizing:border-box}body{margin:0;background:#eeece5;color:#30372f;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}header{padding:38px 55px 31px;display:flex;align-items:flex-end;justify-content:space-between;gap:25px;border-bottom:1px solid #d4d7c8}header span{font-size:10px;letter-spacing:2px;color:#5f6958}h1{font-family:"AppleMyungjo",Georgia,serif;font-size:34px;font-weight:500;letter-spacing:-1px;margin:14px 0 0}header p{font-size:12px;line-height:1.8;color:#5f6958;margin:0}a{color:inherit;text-decoration:none;font-size:11px}.row{padding:28px 45px 34px}.row-label{font-size:10px;letter-spacing:1.7px;display:flex;justify-content:space-between;padding:0 10px 25px;color:#5f6958}.row.dark{background:#171b17;color:#e9e7dd}.row.dark .row-label{color:#a4ad9d}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:28px}.card{text-align:center;min-width:0}.app-icon{width:164px;height:164px;border-radius:23%;overflow:hidden;margin:0 auto}.app-icon svg{display:block;width:100%;height:100%}.card h2{font-family:"AppleMyungjo",Georgia,serif;font-size:21px;font-weight:500;margin:22px 0 11px;letter-spacing:-.5px}.card h2 small{font-family:Georgia,serif;font-size:12px;opacity:.6;margin-right:8px}.card p{font-size:11px;margin:0;opacity:.65}.sizes{display:flex;align-items:center;justify-content:center;gap:17px;margin-top:23px}.sizes .app-icon{margin:0;width:40px;height:40px}.sizes .app-icon.round{width:40px;height:40px;border-radius:50%}.sizes .app-icon.tiny{width:24px;height:24px}.sizes .mono{height:32px;width:32px}.sizes .mono svg{height:100%;width:100%}.sizes .mono svg .icon-art{fill:currentColor;color:inherit}.sizes .mono .secondary{fill:currentColor}.sizes .mono .secondary-stroke{stroke:currentColor}.sizes-label{font-size:8px;letter-spacing:.5px;opacity:.6;margin-top:11px}.footer{padding:23px 55px;font-size:10px;color:#5f6958;display:flex;justify-content:space-between;gap:20px;border-top:1px solid #d4d7c8}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr);gap:35px}.row{padding:28px 20px}.app-icon{width:140px;height:140px}header{padding:25px;display:block}header p{margin-top:20px}.footer{padding:22px;flex-wrap:wrap}}@media(max-width:420px){.grid{grid-template-columns:1fr}.app-icon{width:170px;height:170px}}
</style></head><body><header><div><span>YEOBAEK / PAPER & PAUSE / ICON STUDY 03</span><h1>여백을 위한, 다섯 가지 고유한 형태.</h1></div><p>사이 · 이어짐 · 품 · 리듬 · 잔상<br>직접 그린 브랜드 심볼 01—05</p></header><main id="sheet"></main><footer class="footer"><span>큰 아이콘 164px / 아래: 40px · 원형 40px · 24px · 단색 32px</span><a href="index.html">후보별 앱 조합 보기 ↗</a></footer><script>
document.addEventListener('DOMContentLoaded',()=>{document.querySelector('#sheet').innerHTML=['light','dark'].map(mode=>`<section class="row ${mode}"><div class="row-label"><span>${mode==='light'?'01 / LIGHT · 종이와 올리브':'02 / DARK · 밤의 종이'}</span><span>SPACE AS A SIGNATURE</span></div><div class="grid">${window.YeobaekIcons.map(item=>`<article class="card"><div class="app-icon">${window.yeobaekIconSvg(item.id,mode)}</div><h2><small>${item.number}</small>${item.name}</h2><p>${item.keyword}</p><div class="sizes"><span class="app-icon">${window.yeobaekIconSvg(item.id,mode)}</span><span class="app-icon round">${window.yeobaekIconSvg(item.id,mode)}</span><span class="app-icon tiny">${window.yeobaekIconSvg(item.id,mode)}</span><span class="mono">${window.yeobaekIconSvg(item.id,mode,'monochrome')}</span></div><div class="sizes-label">40 / ROUND / 24 / MONO</div></article>`).join('')}</div></section>`).join('');});
</script></body></html>
